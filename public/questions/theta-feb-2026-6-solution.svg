<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" role="img" aria-labelledby="title desc">
<title id="title">Intersection of two closed half-planes</title>
<desc id="desc">Solid boundaries y equals 4 minus 2x and y equals x over 2 plus 1 meet at six fifths, eight fifths. The shaded overlap is left of the intersection, in Quadrants I, II, III, never IV.</desc>
<rect width="620" height="430" fill="white"/>
<g font-family="Georgia,serif" font-size="19" fill="#171717"><defs><clipPath id="plot"><rect x="60" y="50" width="500" height="300"/></clipPath></defs><path d="M60 50V350" stroke="#e1e5e7"/><text x="60" y="374" text-anchor="middle">-5</text><path d="M115.55555555555554 50V350" stroke="#e1e5e7"/><text x="115.55555555555554" y="374" text-anchor="middle">-4</text><path d="M171.1111111111111 50V350" stroke="#e1e5e7"/><text x="171.1111111111111" y="374" text-anchor="middle">-3</text><path d="M226.66666666666666 50V350" stroke="#e1e5e7"/><text x="226.66666666666666" y="374" text-anchor="middle">-2</text><path d="M282.2222222222222 50V350" stroke="#e1e5e7"/><text x="282.2222222222222" y="374" text-anchor="middle">-1</text><path d="M337.77777777777777 50V350" stroke="#e1e5e7"/><text x="337.77777777777777" y="374" text-anchor="middle">0</text><path d="M393.3333333333333 50V350" stroke="#e1e5e7"/><text x="393.3333333333333" y="374" text-anchor="middle">1</text><path d="M448.8888888888889 50V350" stroke="#e1e5e7"/><text x="448.8888888888889" y="374" text-anchor="middle">2</text><path d="M504.4444444444444 50V350" stroke="#e1e5e7"/><text x="504.4444444444444" y="374" text-anchor="middle">3</text><path d="M560 50V350" stroke="#e1e5e7"/><text x="560" y="374" text-anchor="middle">4</text><path d="M60 350H560" stroke="#e1e5e7"/><text x="48" y="356" text-anchor="end">-4</text><path d="M60 320H560" stroke="#e1e5e7"/><path d="M60 290H560" stroke="#e1e5e7"/><text x="48" y="296" text-anchor="end">-2</text><path d="M60 260H560" stroke="#e1e5e7"/><path d="M60 230H560" stroke="#e1e5e7"/><text x="48" y="236" text-anchor="end">0</text><path d="M60 200H560" stroke="#e1e5e7"/><path d="M60 170H560" stroke="#e1e5e7"/><text x="48" y="176" text-anchor="end">2</text><path d="M60 140H560" stroke="#e1e5e7"/><path d="M60 110H560" stroke="#e1e5e7"/><text x="48" y="116" text-anchor="end">4</text><path d="M60 80H560" stroke="#e1e5e7"/><path d="M60 50H560" stroke="#e1e5e7"/><text x="48" y="56" text-anchor="end">6</text><path d="M60 230H560 M337.77777777777777 50V350" stroke="#171717" stroke-width="1.7"/><text x="575" y="222">x</text><text x="347.77777777777777" y="39">y</text><g clip-path="url(#plot)"><polygon points="60.00,275.00 60.00,50.00 282.22,50.00 404.44,182.00" fill="#a8dac4" fill-opacity=".65"/><polyline points="60.00,-190.00 560.00,350.00" fill="none" stroke="#326baf" stroke-width="3"/><polyline points="60.00,275.00 560.00,140.00" fill="none" stroke="#b83a3a" stroke-width="3"/><circle cx="404.44444444444446" cy="182.00000000000003" r="4" fill="#171717"/></g><text x="60" y="26" fill="#326baf">y ≤ 4 − 2x</text><text x="345" y="26" fill="#b83a3a">y ≥ x/2 + 1</text><text x="70" y="405">Overlap: no points in Quadrant IV</text></g>
</svg>
