<svg xmlns="http://www.w3.org/2000/svg" width="720" height="192" viewBox="0 0 720 192" role="img" aria-labelledby="title desc">
<title id="title">Plane travel with and against the wind</title>
<desc id="desc">Rates are in miles per hour, times in hours, distances in miles. With wind: rate 200 plus w, time 960 divided by 200 plus w, distance 960. Against wind: rate 200 minus w, time 640 divided by 200 minus w, distance 640.</desc>
<rect width="720" height="192" fill="white"/>
<g fill="#171717" font-family="Georgia,serif" font-size="32" text-anchor="middle"><rect x="0" y="0" width="120" height="60" fill="#eef3f5" stroke="#525b61"/><text x="60" y="37">Type</text><rect x="120" y="0" width="160" height="60" fill="#eef3f5" stroke="#525b61"/><text x="200" y="37">Rate</text><rect x="280" y="0" width="270" height="60" fill="#eef3f5" stroke="#525b61"/><text x="415" y="37">Time</text><rect x="550" y="0" width="170" height="60" fill="#eef3f5" stroke="#525b61"/><text x="635" y="37">Distance</text><rect x="0" y="60" width="120" height="66" fill="white" stroke="#525b61"/><text x="60" y="100">With</text><rect x="120" y="60" width="160" height="66" fill="white" stroke="#525b61"/><text x="200" y="100">200 + w</text><rect x="280" y="60" width="270" height="66" fill="white" stroke="#525b61"/><text x="415" y="100">960 / (200 + w)</text><rect x="550" y="60" width="170" height="66" fill="white" stroke="#525b61"/><text x="635" y="100">960</text><rect x="0" y="126" width="120" height="66" fill="white" stroke="#525b61"/><text x="60" y="166">Against</text><rect x="120" y="126" width="160" height="66" fill="white" stroke="#525b61"/><text x="200" y="166">200 − w</text><rect x="280" y="126" width="270" height="66" fill="white" stroke="#525b61"/><text x="415" y="166">640 / (200 − w)</text><rect x="550" y="126" width="170" height="66" fill="white" stroke="#525b61"/><text x="635" y="166">640</text></g>
</svg>
