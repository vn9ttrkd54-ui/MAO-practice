<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" role="img" aria-labelledby="title desc">
<title id="title">Descartes' Rule of Signs possibilities</title>
<desc id="desc">Possible root counts, counting multiplicity: 2 positive, 0 negative, 2 non-real; or 0 positive, 0 negative, 4 non-real.</desc>
<rect width="720" height="248" fill="white"/>
<g fill="#171717" font-family="Georgia,serif" font-size="32" text-anchor="middle"><rect x="0" y="0" width="480" height="62" fill="#eef3f5" stroke="#525b61"/><text x="240" y="38">Possible number of roots</text><rect x="480" y="0" width="120" height="62" fill="#eef3f5" stroke="#525b61"/><text x="540" y="38">Case 1</text><rect x="600" y="0" width="120" height="62" fill="#eef3f5" stroke="#525b61"/><text x="660" y="38">Case 2</text><rect x="0" y="62" width="480" height="62" fill="white" stroke="#525b61"/><text x="240" y="100">Positive real roots</text><rect x="480" y="62" width="120" height="62" fill="white" stroke="#525b61"/><text x="540" y="100">2</text><rect x="600" y="62" width="120" height="62" fill="white" stroke="#525b61"/><text x="660" y="100">0</text><rect x="0" y="124" width="480" height="62" fill="white" stroke="#525b61"/><text x="240" y="162">Negative real roots</text><rect x="480" y="124" width="120" height="62" fill="white" stroke="#525b61"/><text x="540" y="162">0</text><rect x="600" y="124" width="120" height="62" fill="white" stroke="#525b61"/><text x="660" y="162">0</text><rect x="0" y="186" width="480" height="62" fill="white" stroke="#525b61"/><text x="240" y="224">Complex non-real roots</text><rect x="480" y="186" width="120" height="62" fill="white" stroke="#525b61"/><text x="540" y="224">2</text><rect x="600" y="186" width="120" height="62" fill="white" stroke="#525b61"/><text x="660" y="224">4</text></g>
</svg>
