<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title desc">
  <title id="title">Circle, square, and equilateral triangle</title>
  <desc id="desc">A circle is inscribed in a square of side s, and the square is inscribed in an equilateral triangle of side a.</desc>
  <rect width="500" height="400" fill="#fff"/>
  <g fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round">
    <path d="M70 350 L250 42 L430 350 Z"/>
    <rect x="167" y="184" width="166" height="166"/>
    <circle cx="250" cy="267" r="83"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="18" font-style="italic">
    <text x="74" y="205">a</text>
    <text x="170" y="145">s</text>
    <text x="321" y="145">s</text>
    <text x="340" y="273">s</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5">
    <path d="M46 348 L226 40"/>
    <path d="M39 342 L53 354 M219 34 L233 46"/>
  </g>
</svg>
