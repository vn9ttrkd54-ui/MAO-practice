<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">Circle, square, and equilateral triangle</title>
  <desc id="desc">A circle is inscribed in a square of side s, and the square is inscribed in an equilateral triangle of side a.</desc>
  <rect width="520" height="420" fill="#fff"/>
  <g fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round">
    <path d="M70 360 L260 35 L450 360 Z"/>
    <rect x="160" y="190" width="200" height="170"/>
    <circle cx="260" cy="275" r="85"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="22">
    <text x="105" y="190" font-style="italic">a</text>
    <text x="365" y="282" font-style="italic">s</text>
    <text x="246" y="180" font-style="italic">s</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6">
    <path d="M45 360 L235 35"/>
    <path d="M39 354 L53 365 M229 30 L242 41"/>
  </g>
</svg>
