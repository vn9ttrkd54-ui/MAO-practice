<svg xmlns="http://www.w3.org/2000/svg" width="620" height="132" viewBox="0 0 620 132" role="img" aria-labelledby="title description">
  <title id="title">March Regional 2024 table for decreasing differentiable f</title>
  <desc id="description">Columns x=0,2,4,6,8. Row f(x)=20,16,8,2,0. Row f prime(x)=-4,-6,-4,-2,-1. The function is strictly decreasing and differentiable.</desc>
  <rect width="620" height="132" fill="white"/>
  <path d="M10 10H610V122H10Z M110 10V122 M210 10V122 M310 10V122 M410 10V122 M510 10V122 M10 47H610 M10 84H610" fill="none" stroke="#333" stroke-width="1.2"/>
  <g font-family="Georgia, serif" font-size="21" text-anchor="middle" fill="#171717">
    <text x="60" y="36" font-style="italic">x</text><text x="160" y="36">0</text><text x="260" y="36">2</text><text x="360" y="36">4</text><text x="460" y="36">6</text><text x="560" y="36">8</text>
    <text x="60" y="73" font-style="italic">f(x)</text><text x="160" y="73">20</text><text x="260" y="73">16</text><text x="360" y="73">8</text><text x="460" y="73">2</text><text x="560" y="73">0</text>
    <text x="60" y="110" font-style="italic">f'(x)</text><text x="160" y="110">-4</text><text x="260" y="110">-6</text><text x="360" y="110">-4</text><text x="460" y="110">-2</text><text x="560" y="110">-1</text>
  </g>
</svg>
