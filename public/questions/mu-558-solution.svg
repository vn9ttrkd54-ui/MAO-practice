<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" role="img" aria-labelledby="title description">
<title id="title">Logarithmic curve and its two slope-one-half tangents</title>
<desc id="description">The green curve is y equals ln of one plus x squared. Dashed black tangents of slope one-half touch at x equals two minus square root of three and two plus square root of three. The axes and uniform grid show the geometry. Lines with intercept between these boundary intercepts meet the curve three times; each boundary line has two distinct intersections.</desc>
<rect width="620" height="380" fill="white"/>
<defs><clipPath id="plot"><rect x="40" y="36" width="560" height="300"/></clipPath></defs>
<text x="40" y="22" font-family="Arial,sans-serif" font-size="14" fill="#357d43">y = ln(1 + x<tspan baseline-shift="super" font-size="10">2</tspan><tspan baseline-shift="baseline">)</tspan></text>
<text x="330" y="22" font-family="Arial,sans-serif" font-size="13" fill="#333333">Dashed: slope 1/2 tangents</text>
