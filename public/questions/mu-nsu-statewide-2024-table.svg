<svg xmlns="http://www.w3.org/2000/svg" width="620" height="212" viewBox="0 0 620 212" role="img" aria-labelledby="title description">
  <title id="title">NSU March Statewide 2024 function and derivative table</title>
  <desc id="description">Columns x=1,2,3,4,5. Row f(x)=0,3,5,1,0. Row f prime(x)=5,2,-5,-8,-10. Row g(x)=4,5,1,3,2. Row g prime(x)=2,10,20,15,20.</desc>
  <rect width="620" height="212" fill="white"/>
  <path d="M10 8H610V204H10Z M110 8V204 M210 8V204 M310 8V204 M410 8V204 M510 8V204 M10 47H610 M10 86H610 M10 125H610 M10 164H610" fill="none" stroke="#333" stroke-width="1.2"/>
  <g font-family="Georgia, serif" font-size="24" text-anchor="middle" fill="#171717">
    <text x="60" y="36" font-style="italic">x</text><text x="160" y="36">1</text><text x="260" y="36">2</text><text x="360" y="36">3</text><text x="460" y="36">4</text><text x="560" y="36">5</text>
    <text x="60" y="75" font-style="italic">f(x)</text><text x="160" y="75">0</text><text x="260" y="75">3</text><text x="360" y="75">5</text><text x="460" y="75">1</text><text x="560" y="75">0</text>
    <text x="60" y="114" font-style="italic">f'(x)</text><text x="160" y="114">5</text><text x="260" y="114">2</text><text x="360" y="114">-5</text><text x="460" y="114">-8</text><text x="560" y="114">-10</text>
    <text x="60" y="153" font-style="italic">g(x)</text><text x="160" y="153">4</text><text x="260" y="153">5</text><text x="360" y="153">1</text><text x="460" y="153">3</text><text x="560" y="153">2</text>
    <text x="60" y="192" font-style="italic">g'(x)</text><text x="160" y="192">2</text><text x="260" y="192">10</text><text x="360" y="192">20</text><text x="460" y="192">15</text><text x="560" y="192">20</text>
  </g>
</svg>
