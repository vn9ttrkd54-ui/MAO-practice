<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Salt mixture calculation</title>
<desc id="desc">The Mixture column is 100 times the salt mass. Batch 1: 5 percent, 80 pounds, 400. Batch 2: 100 percent, x pounds, 100x. Batch 3: 24 percent, x plus 80 pounds, 24x plus 1920.</desc>
<rect width="720" height="250" fill="white"/>
<g fill="#171717" font-family="Georgia,serif" font-size="32" text-anchor="middle"><rect x="0" y="0" width="150" height="70" fill="#eef3f5" stroke="#525b61"/><text x="75" y="42">Type</text><rect x="150" y="0" width="130" height="70" fill="#eef3f5" stroke="#525b61"/><text x="215" y="42">% of salt</text><rect x="280" y="0" width="200" height="70" fill="#eef3f5" stroke="#525b61"/><text x="380" y="42">Amount (lbs)</text><rect x="480" y="0" width="240" height="70" fill="#eef3f5" stroke="#525b61"/><text x="600" y="42">Mixture*</text><rect x="0" y="70" width="150" height="60" fill="white" stroke="#525b61"/><text x="75" y="107">Batch #1</text><rect x="150" y="70" width="130" height="60" fill="white" stroke="#525b61"/><text x="215" y="107">5</text><rect x="280" y="70" width="200" height="60" fill="white" stroke="#525b61"/><text x="380" y="107">80</text><rect x="480" y="70" width="240" height="60" fill="white" stroke="#525b61"/><text x="600" y="107">400</text><rect x="0" y="130" width="150" height="60" fill="white" stroke="#525b61"/><text x="75" y="167">Batch #2</text><rect x="150" y="130" width="130" height="60" fill="white" stroke="#525b61"/><text x="215" y="167">100</text><rect x="280" y="130" width="200" height="60" fill="white" stroke="#525b61"/><text x="380" y="167">x</text><rect x="480" y="130" width="240" height="60" fill="white" stroke="#525b61"/><text x="600" y="167">100x</text><rect x="0" y="190" width="150" height="60" fill="white" stroke="#525b61"/><text x="75" y="227">Batch #3</text><rect x="150" y="190" width="130" height="60" fill="white" stroke="#525b61"/><text x="215" y="227">24</text><rect x="280" y="190" width="200" height="60" fill="white" stroke="#525b61"/><text x="380" y="227">x + 80</text><rect x="480" y="190" width="240" height="60" fill="white" stroke="#525b61"/><text x="600" y="227">24x + 1920</text></g>
</svg>
