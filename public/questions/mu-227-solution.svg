<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting ellipse and hyperbola</title>
  <desc id="desc">An ellipse and hyperbola centered at two, negative one intersect at four symmetric points.</desc>
  <rect width="500" height="400" fill="#fff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <path d="M50 25V375M110 25V375M170 25V375M230 25V375M290 25V375M350 25V375M410 25V375M470 25V375"/>
    <path d="M30 50H475M30 110H475M30 170H475M30 230H475M30 290H475M30 350H475"/>
  </g>
  <g stroke="#475569" stroke-width="2">
    <path d="M30 170H475"/>
    <path d="M110 25V375"/>
  </g>
  <g fill="none" stroke="#111827" stroke-width="2.75">
    <ellipse cx="230" cy="230" rx="159" ry="104"/>
    <path d="M62 25 C105 92 140 171 145 230 C140 289 105 356 75 390"/>
    <path d="M398 25 C355 92 320 171 315 230 C320 289 355 356 385 390"/>
  </g>
  <g fill="#111827">
    <circle cx="131" cy="149" r="4"/><circle cx="131" cy="311" r="4"/>
    <circle cx="329" cy="149" r="4"/><circle cx="329" cy="311" r="4"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="14">
    <text x="45" y="190">−1</text><text x="99" y="190">0</text><text x="166" y="190">1</text><text x="226" y="190">2</text><text x="286" y="190">3</text><text x="346" y="190">4</text><text x="406" y="190">5</text>
    <text x="91" y="55">2</text><text x="91" y="115">1</text><text x="84" y="235">−1</text><text x="84" y="295">−2</text><text x="84" y="355">−3</text>
  </g>
</svg>
