<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Intersecting ellipse and hyperbola</title>
  <desc id="desc">An ellipse and hyperbola centered at two, negative one intersect at four symmetric points.</desc>
  <rect width="620" height="500" fill="#fff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <path d="M60 50V450M120 50V450M180 50V450M240 50V450M300 50V450M360 50V450M420 50V450M480 50V450M540 50V450"/>
    <path d="M40 70H570M40 130H570M40 190H570M40 250H570M40 310H570M40 370H570M40 430H570"/>
  </g>
  <g stroke="#475569" stroke-width="2">
    <path d="M40 190H570"/>
    <path d="M120 40V450"/>
  </g>
  <g fill="none" stroke="#111827" stroke-width="4">
    <ellipse cx="240" cy="250" rx="159" ry="104"/>
    <path d="M68 40 C120 120 151 192 155 250 C151 308 120 380 68 460"/>
    <path d="M412 40 C360 120 329 192 325 250 C329 308 360 380 412 460"/>
  </g>
  <g fill="#111827">
    <circle cx="141" cy="169" r="5"/><circle cx="141" cy="331" r="5"/>
    <circle cx="339" cy="169" r="5"/><circle cx="339" cy="331" r="5"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="15">
    <text x="108" y="210">0</text><text x="172" y="210">1</text><text x="232" y="210">2</text><text x="292" y="210">3</text><text x="352" y="210">4</text>
    <text x="96" y="135">1</text><text x="92" y="255">−1</text><text x="92" y="315">−2</text><text x="92" y="375">−3</text>
  </g>
</svg>
