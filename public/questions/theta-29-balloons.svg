<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc">
  <title id="title">Balloon pattern equations</title>
  <desc id="desc">Four separate equations involving checker, gray, striped, and dotted balloons.</desc>
  <defs>
    <pattern id="checker" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#111"/><rect x="5" y="5" width="5" height="5" fill="#111"/></pattern>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="4" fill="#222"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.8" fill="#222"/><circle cx="8" cy="8" r="1.8" fill="#222"/></pattern>
    <g id="balloon"><ellipse cy="-7" rx="18" ry="24" stroke="#111" stroke-width="2.5"/><path d="M0 17 C-4 21 4 25 0 30" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect x="1.5" y="1.5" width="597" height="347" rx="8" fill="#fff" stroke="#d9e1ea" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#111">
    <g transform="translate(100 52)" fill="url(#checker)"><use href="#balloon"/></g><text x="145" y="54">+</text><g transform="translate(190 52)" fill="url(#checker)"><use href="#balloon"/></g><text x="235" y="54">+</text><g transform="translate(280 52)" fill="url(#checker)"><use href="#balloon"/></g><text x="390" y="54">= 300</text>
    <g transform="translate(100 132)" fill="#929292"><use href="#balloon"/></g><text x="145" y="134">+</text><g transform="translate(190 132)" fill="url(#checker)"><use href="#balloon"/></g><text x="235" y="134">+</text><g transform="translate(280 132)" fill="#929292"><use href="#balloon"/></g><text x="390" y="134">= 140</text>
    <g transform="translate(70 212)" fill="#929292"><use href="#balloon"/></g><text x="108" y="214">+</text><g transform="translate(146 212)" fill="url(#stripes)"><use href="#balloon"/></g><text x="184" y="214">+</text><g transform="translate(222 212)" fill="url(#checker)"><use href="#balloon"/></g><text x="260" y="214">+</text><g transform="translate(298 212)" fill="url(#stripes)"><use href="#balloon"/></g><text x="410" y="214">= 180</text>
    <g transform="translate(70 292)" fill="#929292"><use href="#balloon"/></g><text x="108" y="294">+</text><g transform="translate(146 292)" fill="url(#dots)"><use href="#balloon"/></g><text x="184" y="294">+</text><g transform="translate(222 292)" fill="url(#dots)"><use href="#balloon"/></g><text x="260" y="294">+</text><g transform="translate(298 292)" fill="url(#stripes)"><use href="#balloon"/></g><text x="397" y="294">= ?</text>
  </g>
</svg>
