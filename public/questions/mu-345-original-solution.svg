<svg xmlns="http://www.w3.org/2000/svg" width="558" height="560" viewBox="0 0 558 560" role="img" aria-labelledby="title">
<title id="title">Integral of f and its inverse partition rectangle from (a,c) to (b,d)</title>
<rect width="558" height="560" fill="white"/>
<defs>
<pattern id="vertical" width="13" height="13" patternUnits="userSpaceOnUse">
<path d="M1 0V13" fill="none" stroke="#ef9c9c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
</pattern>
<pattern id="horizontal" width="13" height="13" patternUnits="userSpaceOnUse">
<path d="M0 1H13" fill="none" stroke="#ef9c9c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10L3 5Z"/>
</marker>
</defs>
<path d="M151 515V455C180 357 244 314 320 302C409 293 456 288 472 204V515Z" fill="url(#vertical)"/>
<path d="M43 199H472V204C456 288 409 293 320 302C244 314 180 357 151 455H43Z" fill="url(#horizontal)"/>
<path d="M43 515V29M43 515H530" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M43 515V199H472V515Z" fill="none" stroke="#b19a22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M43 455H151V515" fill="none" stroke="#4245a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M151 455C180 357 244 314 320 302C409 293 456 288 472 204" fill="none" stroke="#dd3434" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<text x="15" y="213" font-family="Times New Roman,serif" font-size="29" fill="#111" >d</text>
<text x="15" y="465" font-family="Times New Roman,serif" font-size="29" fill="#111" >c</text>
<text x="139" y="548" font-family="Times New Roman,serif" font-size="29" fill="#111" >a</text>
<text x="458" y="548" font-family="Times New Roman,serif" font-size="29" fill="#111" >b</text>
<text x="70" y="491" font-family="Times New Roman,serif" font-size="27" fill="#4245a0" >a·c</text>
<text x="486" y="184" font-family="Times New Roman,serif" font-size="27" fill="#b19a22" >b·d</text>
<g id="forward-integral" transform="translate(298 420)" fill="#c23b32" font-family="Times New Roman,serif" aria-label="Integral from a to b of f(x) dx">
  <rect x="-9" y="-32" width="123" height="66" fill="white" fill-opacity=".94"/>
  <path d="M19 -23C11 -29 9 -19 9 -10L5 17C4 27 -3 29 -5 23" fill="none" stroke="#c23b32" stroke-width="2.7" stroke-linecap="round"/>
  <text class="upper-limit" x="22" y="-20" font-size="16" font-style="italic">b</text>
  <text class="lower-limit" x="10" y="31" font-size="16" font-style="italic">a</text>
  <text class="integrand" x="40" y="8" font-size="25">
<tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) d<tspan font-style="italic">x</tspan>
</text>
</g>
<g id="inverse-integral" transform="translate(128 268)" fill="#c23b32" font-family="Times New Roman,serif" aria-label="Integral from c to d of f inverse(y) dy">
  <rect x="-9" y="-32" width="161" height="66" fill="white" fill-opacity=".94"/>
  <path d="M19 -23C11 -29 9 -19 9 -10L5 17C4 27 -3 29 -5 23" fill="none" stroke="#c23b32" stroke-width="2.7" stroke-linecap="round"/>
  <text class="upper-limit" x="22" y="-20" font-size="16" font-style="italic">d</text>
  <text class="lower-limit" x="10" y="31" font-size="16" font-style="italic">c</text>
  <text class="integrand" x="40" y="8" font-size="25">
<tspan font-style="italic">f</tspan>
<tspan font-size="16" dy="-11">−1</tspan>
<tspan dy="11">(<tspan font-style="italic">y</tspan>) d<tspan font-style="italic">y</tspan>
</tspan>
</text>
</g>
</svg>
